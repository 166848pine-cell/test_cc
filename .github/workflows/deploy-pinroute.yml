# PinRoute を GitHub Pages に公開する。
#
# 使い方:
#   1. このファイルを含む状態でリポジトリに push する
#   2. GitHub の Settings → Pages → Source を「GitHub Actions」にする
#   3. 公開URL: https://<ユーザー名>.github.io/<リポジトリ名>/
#
# 既定のビルドは一般公開用で、ルート計算(OSRMデモサーバー)を含まない。
# 提供元が公開アプリからの利用を認めていないため。経路は「Googleマップで開く」で代替する。
name: Deploy PinRoute to Pages

on:
  push:
    branches: [main]
    paths:
      - "地図アプリ/pinroute/**"
      - ".github/workflows/deploy-pinroute.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。実行中のものは走り切らせる。
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: "地図アプリ/pinroute"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "地図アプリ/pinroute/package-lock.json"

      - name: 依存を入れる
        run: npm ci

      - name: 型チェックと単体・結合テスト
        run: |
          npm run lint
          npm run test

      - name: ビルド(公開用)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "地図アプリ/pinroute/dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
